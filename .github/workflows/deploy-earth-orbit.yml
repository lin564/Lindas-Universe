name: Deploy Tilt to Cloudflare

on:
  push:
    branches: [main]
    paths:
      - "earth-orbit/**"
      - ".github/workflows/deploy-earth-orbit.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy static site Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ab0fe0d5a72e29f4c9d40da04c603e2e
          workingDirectory: earth-orbit
          wranglerVersion: "4.100.0"
